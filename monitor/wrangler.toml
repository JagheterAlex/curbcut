name = "curbcut-monitor"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Routed from the main zone so the form posts same-origin and needs no CORS,
# no preflight and no JavaScript.
[[routes]]
pattern = "curbcut.org/api/*"
zone_name = "curbcut.org"

[[d1_databases]]
binding = "DB"
database_name = "curbcut"
database_id = "PLACEHOLDER_SET_BY_WRANGLER_D1_CREATE"

[observability]
enabled = true
