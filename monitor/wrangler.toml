name = "curbcut-monitor"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Routed from the main zone so forms post same-origin and need no CORS,
# no preflight and no JavaScript.
[[routes]]
pattern = "curbcut.org/api/*"
zone_name = "curbcut.org"

[[routes]]
pattern = "curbcut.org/scan*"
zone_name = "curbcut.org"

# The audit request page. It lives in the Worker rather than in the static site
# so the scan result can hand it the address that was just scanned, prefilled,
# with no JavaScript to do it. The wildcard is not decoration: a route pattern
# with no wildcard matches only the bare path, so "/audit?site=..." fell through
# to a 404 while "/audit" answered fine.
[[routes]]
pattern = "curbcut.org/audit*"
zone_name = "curbcut.org"

# The page broken on purpose. Served here rather than by Pages so this one path
# can allow a same-origin frame, which the site-wide default-src 'none' forbids
# and the untitled advert frame needs in order to be an untitled advert frame.
[[routes]]
pattern = "curbcut.org/demo/*"
zone_name = "curbcut.org"

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "DB"
database_name = "curbcut"
database_id = "03bade3a-799a-481c-8eab-1e4978a6ddcc"

# Caches scan results and carries the rate-limit counters. Nothing in here is
# personal: keys are URLs and a hash of the client address, never the address.
[[kv_namespaces]]
binding = "CACHE"
id = "3d4c567297d54e018dfdfeae22bb096d"

# axe-core is vendored as text because the Worker cannot reach it through
# createRequire the way the Node CLI does.
[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

[observability]
enabled = true

# Notifying a person that somebody left their address. Scoped to one recipient
# so the binding cannot be used to send anywhere else. hello@curbcut.org is a
# verified Email Routing destination that forwards to a real inbox; using the
# role address keeps a personal one out of this public file.
[[send_email]]
name = "NOTIFY"
destination_address = "hello@curbcut.org"
