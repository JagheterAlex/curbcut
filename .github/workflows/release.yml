name: Release to npm

# Publishes when a version tag is pushed:  git tag v0.2.0 && git push --tags
#
# Authentication is npm Trusted Publishing (OIDC). There is no NPM_TOKEN secret
# in this repository and there must never be one: the runner mints a short-lived
# OIDC token instead, so there is no long-lived credential to leak or rotate.
#
# One-time setup on npmjs.com, after the first manual publish:
#   Package settings -> Trusted publishers -> GitHub Actions
#   Repository: JagheterAlex/curbcut     Workflow: release.yml

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required to mint the OIDC token

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # never cache in a release build

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 ships a new enough
      # npm, but pinning it here means a future runner image cannot quietly
      # downgrade us into the 404 that an unauthenticated publish returns.
      - name: Use an npm that can do trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install the browser the scanner drives
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Refuse to ship a site that fails its own scanner
        run: |
          npx -y http-server site -p 8799 --silent &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8799/ >/dev/null && break
            sleep 1
          done
          node bin/curbcut.js \
            http://127.0.0.1:8799/ \
            http://127.0.0.1:8799/terms.html \
            http://127.0.0.1:8799/privacy.html \
            http://127.0.0.1:8799/accessibility.html \
            --fail-on P4

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
